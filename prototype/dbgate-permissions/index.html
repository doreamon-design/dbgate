<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DbGate · 团队权限管理 产品原型 v0.1</title>
    <!--
      DbGate 团队权限管理 · 可点产品原型 v0.1
      纯静态单文件，无外部依赖。演示数据仅用于确认信息架构与交互，非真实后端数据。
      实现时：文案走 translations/*.json，选择器用 data-testid（ComponentName_identifier）。
    -->
    <style>
      * { box-sizing: border-box; }
      :root {
        --rail: #15181d; --side: #1b1f26; --bg: #21252c; --panel: #262b33; --panel2: #2c323c;
        --border: #383f4a; --text: #e8ebf1; --muted: #98a2b3; --accent: #2f86e0; --accent2: #2268b4;
        --green: #2ea043; --amber: #d29922; --red: #da3633; --purple: #8957e5; --slate: #6b7686;
        --radius: 6px; --shadow: 0 14px 40px rgba(0,0,0,.45);
      }
      html[data-theme='light'] {
        --rail: #e6ebf2; --side: #f1f4f8; --bg: #f7f9fc; --panel: #ffffff; --panel2: #eef2f7;
        --border: #d5dbe4; --text: #1c2229; --muted: #5b6673; --shadow: 0 14px 40px rgba(16,24,40,.15);
      }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .ic { width: 18px; height: 18px; flex: none; }
      .ic.sm { width: 14px; height: 14px; }
      button { font: inherit; color: inherit; }
      input, select, textarea {
        font: inherit; color: var(--text); background: var(--panel2);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 8px; outline: none;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #4a525f66; border-radius: 6px; }

      /* ---------- shell ---------- */
      .app { display: flex; flex-direction: column; height: 100vh; }
      .topbar {
        height: 46px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px;
        background: var(--side); border-bottom: 1px solid var(--border);
      }
      .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .2px; }
      .logo .dot { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #2f86e0, #8957e5); }
      .proto-badge {
        font-size: 11px; padding: 2px 7px; border-radius: 999px; color: #ffd479;
        border: 1px solid #ffd47955; background: #ffd47914;
      }
      .grow { flex: 1; }
      .topbar .tool {
        display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: var(--radius);
        background: transparent; border: 1px solid transparent; cursor: pointer;
      }
      .topbar .tool:hover { background: var(--panel2); border-color: var(--border); }
      .user-chip { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); cursor: pointer; }

      .body { flex: 1; display: flex; min-height: 0; }
      .rail {
        width: 54px; flex: none; background: var(--rail); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px;
      }
      .rail .rbtn {
        position: relative; width: 40px; height: 38px; display: grid; place-items: center; border-radius: var(--radius);
        color: var(--muted); border: 1px solid transparent; background: transparent; cursor: pointer;
      }
      .rail .rbtn:hover { background: var(--panel2); color: var(--text); }
      .rail .rbtn.active { background: var(--panel2); color: var(--accent); border-color: var(--border); }
      .rail .rbtn.locked { opacity: .38; cursor: not-allowed; }
      .rail .rbtn .lock { position: absolute; right: 3px; bottom: 3px; width: 12px; height: 12px; color: var(--amber); }

      .side {
        width: 250px; flex: none; background: var(--side); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; min-height: 0;
      }
      .side-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
      .side-head .t { font-weight: 600; }
      .side-body { overflow: auto; padding: 8px; flex: 1; }
      .side-item {
        display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius);
        cursor: pointer; color: var(--text); border: 1px solid transparent;
      }
      .side-item:hover { background: var(--panel2); }
      .side-item.active { background: var(--panel2); border-color: var(--border); color: var(--accent); font-weight: 600; }
      .side-item .badge { margin-left: auto; font-size: 11px; color: var(--muted); }
      .side-note { font-size: 11.5px; color: var(--muted); padding: 6px 10px; line-height: 1.5; }

      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .crumb {
        height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;
        border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; background: var(--side);
      }
      .content { flex: 1; overflow: auto; padding: 16px; }

      /* ---------- generic ---------- */
      h1 { font-size: 17px; margin: 0 0 2px; }
      h2 { font-size: 14px; margin: 0 0 10px; }
      .sub { color: var(--muted); font-size: 12px; }
      .row { display: flex; align-items: center; gap: 10px; }
      .row.wrap { flex-wrap: wrap; }
      .between { justify-content: space-between; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
      .card + .card { margin-top: 14px; }
      .card h2 { display: flex; align-items: center; gap: 7px; }
      .grid { display: grid; gap: 12px; }
      .grid.k4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
      .grid.k2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--radius);
        background: var(--panel2); border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .btn.primary:hover { background: var(--accent2); }
      .btn.ghost { background: transparent; }
      .btn.danger { color: #ff8b86; border-color: #da363355; }
      .btn.sm { padding: 3px 8px; font-size: 12px; }
      .pill {
        display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
        font-size: 11.5px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
      }
      .pill.b { color: #7cc0ff; border-color: #2f86e055; background: #2f86e014; }
      .pill.g { color: #6fdc8c; border-color: #2ea04355; background: #2ea04314; }
      .pill.a { color: #ffd479; border-color: #d2992255; background: #d2992214; }
      .pill.r { color: #ff8b86; border-color: #da363355; background: #da363314; }
      .pill.p { color: #c3a6ff; border-color: #8957e555; background: #8957e514; }
      table.tbl { width: 100%; border-collapse: collapse; }
      table.tbl th, table.tbl td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--panel2); position: sticky; top: 0; z-index: 1; }
      table.tbl tbody tr:hover { background: #ffffff08; }
      .empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; }
      .divider { height: 1px; background: var(--border); margin: 12px 0; }
      .kv { display: grid; grid-template-columns: 118px 1fr; gap: 6px 10px; font-size: 12.5px; }
      .kv .k { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .hint { color: var(--muted); font-size: 11.5px; line-height: 1.6; }
      .box { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--panel2); }
      .switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
      .switch .track { width: 32px; height: 18px; border-radius: 999px; background: var(--border); position: relative; transition: .15s; }
      .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .15s; }
      .switch.on .track { background: var(--accent); }
      .switch.on .track::after { transform: translateX(14px); }
      .pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .pills .p { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; font-size: 12.5px; }
      .pills .p.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

      .lv { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid; white-space: nowrap; }
      .lv-dot { width: 7px; height: 7px; border-radius: 50%; }
      .lv-deny { color: #8b95a3; border-color: #6b768655; background: #6b768618; }
      .lv-deny .lv-dot { background: #6b7686; }
      .lv-view { color: #a9b4c4; border-color: #8b95a355; background: #8b95a318; }
      .lv-view .lv-dot { background: #a9b4c4; }
      .lv-read { color: #6fdc8c; border-color: #2ea04355; background: #2ea04318; }
      .lv-read .lv-dot { background: #2ea043; }
      .lv-write { color: #7cc0ff; border-color: #2f86e055; background: #2f86e018; }
      .lv-write .lv-dot { background: #2f86e0; }
      .lv-script { color: #c3a6ff; border-color: #8957e555; background: #8957e518; }
      .lv-script .lv-dot { background: #8957e5; }

      /* ---------- matrix ---------- */
      .matrix-wrap { overflow: auto; max-height: calc(100vh - 260px); border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
      table.matrix { border-collapse: separate; border-spacing: 0; font-size: 12px; }
      table.matrix th, table.matrix td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 4px 8px; white-space: nowrap; }
      table.matrix thead th { position: sticky; top: 0; background: var(--panel2); z-index: 3; text-align: left; }
      table.matrix .sticky { position: sticky; left: 0; background: var(--panel); z-index: 2; }
      table.matrix thead .sticky { z-index: 4; background: var(--panel2); }
      table.matrix select { border: 1px solid transparent; background: transparent; padding: 2px 4px; font-size: 12px; width: 100%; }
      table.matrix select:hover { border-color: var(--border); background: var(--panel2); }
      tr.env-row td { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 11.5px; }

      /* ---------- db tree ---------- */
      .tree { font-size: 12.5px; }
      .tree .n { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: var(--radius); }
      .tree .n.conn { font-weight: 600; }
      .tree .n.db { padding-left: 24px; }
      .tree .n.tab { padding-left: 46px; color: var(--muted); }
      .tree .n.tab .tag { margin-left: auto; }
      .tree .n.blocked { opacity: .45; text-decoration: line-through; }

      /* ---------- modal ---------- */
      .modal-mask { position: fixed; inset: 0; background: #000000a8; display: grid; place-items: center; z-index: 50; }
      .modal { width: min(680px, 94vw); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
      .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
      .modal-head .t { font-weight: 600; }
      .modal-body { padding: 14px; }
      .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
      .field { display: grid; grid-template-columns: 132px 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
      .field.top { align-items: start; }
      .field .lb { color: var(--muted); font-size: 12.5px; }
      .field .ctl { min-width: 0; }
      .field input[type='text'], .field select, .field input[type='number'] { width: 100%; }
      .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px; }

      .toast {
        position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px;
      }
      .toast .t {
        background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
        border-radius: 8px; padding: 9px 12px; box-shadow: var(--shadow); font-size: 12.5px; max-width: 380px;
      }
      .banner {
        display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px;
        background: #2f86e014; border: 1px solid #2f86e055; color: #a9d1ff; font-size: 12.5px; margin-bottom: 14px;
      }
      .stat .v { font-size: 22px; font-weight: 700; }
      .stat .l { color: var(--muted); font-size: 12px; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .split { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 14px; }
      @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="logo"><span class="dot"></span> DbGate <span class="sub" style="font-weight: 400">社区版</span></div>
        <span class="proto-badge">产品原型 v0.1 · 演示数据</span>
        <div class="grow"></div>
        <button class="tool" data-act="help" data-testid="TopBar_helpButton"></button>
        <button class="tool" data-act="theme" data-testid="TopBar_themeButton"><span id="theme-label"></span></button>
        <div class="user-chip" data-act="user-menu" data-testid="TopBar_userChip">
          <span id="avatar"></span><span id="cur-user"></span><span id="cur-role" class="sub"></span>
        </div>
      </header>
      <div class="body">
        <nav class="rail" id="rail"></nav>
        <aside class="side">
          <div class="side-head"><span id="side-icon"></span><span class="t" id="side-title"></span></div>
          <div class="side-body" id="side-body"></div>
        </aside>
        <main class="main">
          <div class="crumb" id="crumb"></div>
          <div class="content" id="content"></div>
        </main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div class="toast" id="toast"></div>

    <script>
      // ============================================================ 工具
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = s =>
        String(s ?? '').replace(
          /[&<>"']/g,
          c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );

      const ICONS = {
        database:
          '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
        files:
          '<path d="M3.5 6.5A2 2 0 0 1 5.5 4.5h3.2l2 2.2h7.8a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
        history: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
        plugins:
          '<path d="M10 4h4v3a2 2 0 1 0 4 0V4h2v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4v-6h3a2 2 0 1 0 0-4H4V4h6z"/>',
        admin:
          '<path d="M12 3.2l7 2.8v5.6c0 4.4-2.9 7.5-7 9-4.1-1.5-7-4.6-7-9V6z"/><path d="M9.2 12.2l2 2 3.6-4"/>',
        settings:
          '<path d="M4 7.5h8M16 7.5h4M4 16.5h4M12 16.5h8"/><circle cx="14" cy="7.5" r="2"/><circle cx="10" cy="16.5" r="2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>',
        close: '<path d="M6 6l12 12M18 6L6 18"/>',
        check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
        lock: '<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
        user: '<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>',
        warning: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
        table: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10"/>',
        key: '<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3M15 12v2"/>',
        down: '<path d="M6 9l6 6 6-6"/>',
        edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
        trash: '<path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/>',
        filter: '<path d="M3.5 5.5h17l-6.5 7.5v6l-4 2v-8z"/>',
        mask: '<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
        clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
        link: '<path d="M9 15l6-6"/><path d="M10.5 6.5l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M13.5 17.5l-1 1a4 4 0 0 1-6-6l1-1"/>',
        info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
      };
      const svg = (name, cls = '') =>
        `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${
          ICONS[name] || ''
        }</svg>`;

      // ============================================================ 权限模型常量
      // 与 packages/api/src/utility/hasPermission.js 中已有的 level 定义保持一致
      const DB_LEVELS = [
        { id: 'deny', label: '无权限', idx: 0, cls: 'lv-deny', desc: '看不到这个库' },
        { id: 'view', label: '可见', idx: 1, cls: 'lv-view', desc: '能看到库存在，不能看内容/结构' },
        { id: 'read_content', label: '只读', idx: 2, cls: 'lv-read', desc: 'SELECT / 浏览数据 / 导出' },
        { id: 'write_data', label: '读写', idx: 3, cls: 'lv-write', desc: 'INSERT / UPDATE / DELETE' },
        { id: 'run_script', label: '执行脚本', idx: 4, cls: 'lv-script', desc: '任意 SQL，含 DDL（受操作开关约束）' },
      ];
      const level = id => DB_LEVELS.find(l => l.id === id) || DB_LEVELS[0];
      const lvBadge = id => {
        const l = level(id);
        return `<span class="lv ${l.cls}"><span class="lv-dot"></span>${l.label}</span>`;
      };
      const OBJ_SCOPES = [
        { id: 'tables', label: '表' },
        { id: 'views', label: '视图' },
        { id: 'tables_views_collections', label: '表/视图/集合' },
        { id: 'procedures', label: '存储过程' },
        { id: 'functions', label: '函数' },
        { id: 'sql_objects', label: '过程/函数/触发器' },
        { id: 'collections', label: '集合' },
      ];
      const OBJ_LEVELS = ['read', 'update_only', 'create_update_delete', 'run_script', 'deny'];
      const objLabel = id => ({ read: '读取', update_only: '只更新', create_update_delete: '增删改', run_script: '执行脚本', deny: '拒绝' }[id] || id);

      // ============================================================ 演示数据
      const connections = [
        {
          id: 'con-prod-mysql', name: '生产订单库', engine: 'MySQL', host: '10.20.1.11:3306', env: 'prod', objLabel: '表',
          dbs: [
            { name: 'order_db', tables: ['orders', 'order_items', 'refunds', 'coupons'] },
            { name: 'user_db', tables: ['customers', 'addresses', 'customer_tags'] },
            { name: 'pay_db', tables: ['payments', 'settlements', 'invoices'] },
            { name: 'log_db', tables: ['access_log', 'audit_log'] },
          ],
        },
        {
          id: 'con-prod-pg', name: '用户中心', engine: 'PostgreSQL', host: '10.20.1.21:5432', env: 'prod', objLabel: '表',
          dbs: [
            { name: 'usercenter', tables: ['users', 'roles', 'user_profile', 'login_log'] },
            { name: 'analytics', tables: ['daily_stats', 'funnel', 'retention'] },
          ],
        },
        {
          id: 'con-test-mysql', name: '测试库', engine: 'MySQL', host: '10.20.9.31:3306', env: 'test', objLabel: '表',
          dbs: [
            { name: 'order_db_test', tables: ['orders', 'order_items'] },
            { name: 'user_center_test', tables: ['users'] },
            { name: 'sandbox', tables: ['t_tmp_1', 't_tmp_2'] },
          ],
        },
        {
          id: 'con-redis', name: '会话缓存', engine: 'Redis', host: '10.20.1.41:6379', env: 'prod', objLabel: '键',

        const denied = allDbs.filter(d => effectiveDbLevel(u, d.conid, d.db).level === 'deny');
        const role = roleById(u.roles[0]) || {};
        const ops = role.ops || {};
        const items = [];
        denied.slice(0, 6).forEach(d => items.push(`<span class="pill r">${esc(connById(d.conid).name)} / <span class="mono">${esc(d.db)}</span>：未授权</span>`));
        if (role.limits?.hours) items.push(`<span class="pill a">时段限制：${esc(role.limits.hours)}</span>`);
        if (role.limits?.maxRows) items.push(`<span class="pill a">单次最多返回 ${role.limits.maxRows} 行</span>`);
        if (!ops.ddl) items.push(`<span class="pill a">禁止 DDL</span>`);
        if (!ops.backup) items.push(`<span class="pill a">禁止备份/恢复</span>`);
        if (!ops.kill) items.push(`<span class="pill a">禁止杀进程</span>`);
        if (!ops.multi) items.push(`<span class="pill a">禁止多语句执行</span>`);
        return `<div class="pills" style="flex-direction:column;align-items:flex-start">${items.join('') || '<span class="sub">无限制</span>'}</div>

        const body = `

                  ${r.rowFilters.length ? r.rowFilters.map(f => `<div class="box" style="margin-bottom:6px"><div class="mono">${esc(connById(f.conid)?.name || f.conid)} / ${esc(f.db)}.${esc(f.table)}</div>
                    <div class="mono" style="color:#7cc0ff">WHERE ${esc(f.expr)}</div>
                    <button class="btn sm ghost danger" data-act="del-rowfilter:${f.id}" style="margin-top:6px">${svg('trash', 'sm')} 删除</button></div>`).join('') : '<div class="hint">未配置。开启后查询会自动追加 WHERE 条件，成员只能看到属于自己的行。</div>'}

                <div class="card" style="padding:12px">
                  <div class="row between"><h2>${svg('mask')} 列级脱敏 / 隐藏</h2><button class="btn sm" data-act="add-colmask">${svg('plus', 'sm')} 添加</button></div>
                  ${r.colMasks.length ? `<table class="tbl"><tbody>${r.colMasks.map(m => `<tr><td class="mono sub">${esc(connById(m.conid)?.name || m.conid)}/${esc(m.db)}.${esc(m.table)}</td>

            <div class="pills">${users.filter(u => u.roles.includes(r.id)).map(u => `<span class="pill b">${svg('user', 'sm')} ${esc(u.name)} <span class="mono">${esc(u.login)}</span></span>`).join('') || '<span class="sub">暂无成员</span>'}</div>`;
        return '';
      }

      // ============================================================ 访问矩阵
      function renderMatrix() {
        const cols = state.matrixMode === 'role' ? roles : users;
        let rows = allDbs.slice();
        if (state.matrixEnv !== 'all') rows = rows.filter(r => r.conn.env === state.matrixEnv);
        if (state.matrixSearch) rows = rows.filter(r => (r.conn.name + r.db).toLowerCase().includes(state.matrixSearch.toLowerCase()));
        const colLabel = c => (state.matrixMode === 'role' ? c.name : `${c.name} ${c.login}`);
        const groups = {};
        rows.forEach(r => { (groups[r.conid] = groups[r.conid] || []).push(r); });
        return `
          <div class="row between wrap" style="margin-bottom:12px">
            <div><h1>访问矩阵</h1><div class="sub">行 = 数据库，列 = ${state.matrixMode === 'role' ? '角色' : '成员'}。一眼核对"谁能看到哪个库"；直接在下拉里改档位。</div></div>
            <div class="row">
              <div class="pills"><div class="p ${state.matrixMode === 'role' ? 'active' : ''}" data-act="matrix-mode:role">按角色</div>
                <div class="p ${state.matrixMode === 'user' ? 'active' : ''}" data-act="matrix-mode:user">按成员（只读）</div></div>
              <select data-input="matrix-env"><option value="all" ${state.matrixEnv === 'all' ? 'selected' : ''}>全部环境</option>
                <option value="prod" ${state.matrixEnv === 'prod' ? 'selected' : ''}>生产</option>
                <option value="test" ${state.matrixEnv === 'test' ? 'selected' : ''}>测试</option>
                <option value="internal" ${state.matrixEnv === 'internal' ? 'selected' : ''}>内部</option></select>
              <input type="text" placeholder="搜索库 / 连接" value="${esc(state.matrixSearch)}" data-input="matrix-search" data-testid="AdminMatrixTab_searchInput" />
            </div>
          </div>
          <div class="legend" style="margin-bottom:8px">${DB_LEVELS.map(l => `<span class="row" style="gap:6px">${lvBadge(l.id)}<span class="sub">${l.desc}</span></span>`).join('')}</div>
          <div class="matrix-wrap">
            <table class="matrix" data-testid="AdminMatrixTab_matrix">
              <thead><tr><th class="sticky" style="min-width:230px">连接 / 数据库</th>
                ${cols.map(c => `<th style="min-width:${state.matrixMode === 'role' ? 150 : 120}px">${esc(colLabel(c))}${state.matrixMode === 'role' ? `<div class="sub" style="font-weight:400">${memberCount(c.id)} 人</div>` : ''}</th>`).join('')}</tr></thead>
              <tbody>
                ${Object.entries(groups).map(([conid, list]) => {
                  const c = connById(conid);
                  return `<tr class="env-row"><td class="sticky">${esc(c.name)} <span class="pill ${envCls(c.env)}">${envLabel(c.env)}</span> <span class="sub mono">${esc(c.host)}</span></td>
                    ${cols.map(() => '<td></td>').join('')}</tr>
                    ${list.map(row => `<tr><td class="sticky mono">${esc(row.db)}</td>
                      ${cols.map(col => {
                        if (state.matrixMode === 'role') {
                          const lv = roleDbLevel(col, row.conid, row.db);
                          const disabled = !col.connections.all && !col.connections.ids.includes(row.conid);
                          return `<td><select data-cell="${col.id}|${row.conid}|${row.db}" ${disabled ? 'disabled' : ''} data-testid="AdminMatrixTab_cell_${col.id}_${row.db}">
                            ${disabled ? '<option>（连接未授权）</option>' : ''}
                            <option value="">— 继承/无规则</option>
                            ${DB_LEVELS.map(l => `<option value="${l.id}" ${lv === l.id ? 'selected' : ''}>${l.label}</option>`).join('')}
                          </select></td>`;
                        }
                        const e = effectiveDbLevel(col, row.conid, row.db);
                        return `<td>${lvBadge(e.level)}${e.sources.length ? `<span class="sub" style="margin-left:6px">${esc(e.sources.map(s => s.role).join('+'))}</span>` : ''}</td>`;
                      }).join('')}
                    </tr>`).join('')}`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div class="hint" style="margin-top:10px">${state.matrixMode === 'role'
            ? '下拉里选档位即为该角色添加/覆盖一条数据库规则；选「— 继承/无规则」则删除该库上的显式规则。'
            : '成员列的档位由角色并集实时算出，不可直接编辑 —— 这样可以避免"某个人被悄悄单独放权"。'}</div>`;
      }

      // ============================================================ 权限预览
      function renderPreview() {
        const u = userById(state.previewUserId) || users[0];
        const s = effectiveSummary(u);
        const denied = allDbs.filter(d => effectiveDbLevel(u, d.conid, d.db).level === 'deny');
        return `
          <div class="row between wrap" style="margin-bottom:12px">
            <div><h1>权限预览 / 模拟</h1><div class="sub">以某个成员的身份看一遍：他能看到哪些库、哪些被脱敏、哪些被拒绝。上线前用它做验收。</div></div>
            <div class="row"><span class="sub">模拟身份</span>
              <select data-input="preview-user" data-testid="AdminPreviewTab_userSelect">
                ${users.map(x => `<option value="${x.id}" ${x.id === u.id ? 'selected' : ''}>${esc(x.name)}（${esc(x.login)}）</option>`).join('')}
              </select>
              <button class="btn" data-act="open-as-user:${u.id}">${svg('database', 'sm')} 以该身份打开数据库</button></div>
          </div>
          <div class="grid k4">
            <div class="card stat"><div class="v">${s.conns}</div><div class="l">可见连接</div></div>

            <div class="card stat"><div class="v">${u.roles.map(r => roleById(r)?.colMasks.length || 0).reduce((a, b) => a + b, 0)}</div><div class="l">生效的列脱敏</div></div>

          </div>
          <div class="split" style="margin-top:14px">
            <div class="card">
              <h2>${svg('database')} 该成员看到的数据库树</h2>
              ${renderDbTreeFor(u)}
              <div class="hint" style="margin-top:8px">这一棵树和成员自己登录后左侧"数据库"里看到的完全一致。</div>
            </div>
            <div>
              <div class="card">
                <h2>${svg('link')} 权限来源</h2>
                <div class="pills" style="flex-direction:column;align-items:flex-start">
                  ${u.roles.map(rid => { const r = roleById(rid); return `<span class="pill b">${esc(r.name)}（${r.databases.length} 条库规则）</span>`; }).join('')}
                </div>
                <div class="hint" style="margin-top:8px">最终档位 = 各角色取最高（deny 不参与提升）。</div>
              </div>
              <div class="card">
                <h2>${svg('warning')} 被拒绝</h2>
                ${renderDeniedList(u)}
              </div>
              <div class="card">
                <h2>${svg('settings')} 该成员的操作限制</h2>
                <div class="kv">
                  <span class="k">最大返回行数</span><span>${(() => { const r = roleById(u.roles[0]); return r.limits.maxRows || '不限'; })()}</span>
                  <span class="k">查询超时</span><span>${(() => { const r = roleById(u.roles[0]); return r.limits.timeout ? r.limits.timeout + ' 秒' : '不限'; })()}</span>
                  <span class="k">允许时段</span><span>${(() => { const r = roleById(u.roles[0]); return r.limits.hours || '不限'; })()}</span>
                  <span class="k">DDL</span><span>${(() => { const r = roleById(u.roles[0]); return r.ops.ddl ? '允许' : '禁止'; })()}</span>
                </div>
              </div>
            </div>
          </div>`;
      }
      function renderDbTreeFor(u) {
        const saved = state.currentUserId;
        state.currentUserId = u.id;
        const html = renderDbTree(false);
        state.currentUserId = saved;
        return html;
      }

      // ============================================================ 审计
      function renderAudit() {
        const filters = [['all', '全部'], ['deny', '被拒绝'], ['query', '查询/执行'], ['mask', '脱敏命中'], ['admin', '权限变更'], ['login', '登录']];
        const list = audit.filter(a => state.auditFilter === 'all' || a.type === state.auditFilter);
        return `
          <div class="row between wrap" style="margin-bottom:12px">
            <div><h1>审计日志</h1><div class="sub">谁、什么时候、对哪个库做了什么、成没成功。权限改了以后必须能回溯。</div></div>
            <div class="row"><button class="btn">${svg('down', 'sm')} 导出 CSV</button><button class="btn primary" data-act="audit-retention">${svg('clock', 'sm')} 保留策略</button></div>
          </div>
          <div class="pills" style="margin-bottom:10px">${filters.map(([id, n]) => `<div class="p ${state.auditFilter === id ? 'active' : ''}" data-act="audit-filter:${id}">${n}</div>`).join('')}</div>
          <div class="card" style="padding:0;overflow:hidden">
            <table class="tbl" data-testid="AdminAuditTab_logTable">
              <thead><tr><th>时间</th><th>成员</th><th>类型</th><th>目标</th><th>语句 / 操作</th><th>结果</th><th>耗时</th><th>来源 IP</th></tr></thead>
              <tbody>${list.map(a => {
                const [label, cls] = auditTypeLabel[a.type] || [a.type, ''];
                return `<tr><td class="mono sub">${esc(a.t)}</td><td>${esc(userById('u-' + a.user)?.name || a.user)} <span class="sub mono">${esc(a.user)}</span></td>
                  <td><span class="pill ${cls}">${label}</span></td>
                  <td class="mono sub">${a.conn ? esc(connById(a.conn)?.name || a.conn) + ' / ' + esc(a.db) : '—'}</td>
                  <td class="mono" style="max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.text)}">${esc(a.text)}</td>
                  <td>${a.res.startsWith('拒绝') ? `<span class="pill r">${esc(a.res)}</span>` : `<span class="pill g">${esc(a.res)}</span>`}</td>
                  <td class="mono sub">${a.ms} ms</td><td class="mono sub">${esc(a.ip)}</td></tr>`;
              }).join('')}</tbody>
            </table>
          </div>
          <div class="hint" style="margin-top:10px">后端已有 <span class="mono">audit_log</span> 表与 <span class="mono">AppLogTab</span>（社区版已存在，<span class="mono">data-testid</span> 前缀就是 <span class="mono">AdminAuditLogTab_</span>）。本页只需补上"权限变更"这一类事件与按成员/库/结果筛选。</div>`;
      }

      // ============================================================ 认证方式
      function renderAuth() {
        const methods = [
          { icon: 'key', name: '本地密码', desc: '管理员在网页里给成员设密码（bcrypt 存 <span class="mono">~/.dbgate/users.json</span>），支持强制首次改密与找回。', on: true, tag: '推荐起步' },
          { icon: 'link', name: 'LDAP / Active Directory', desc: '成员用域账号登录，登录名作为权限主体的键；组映射可自动分配角色。', on: false, tag: '' },
          { icon: 'link', name: 'OAuth 2.0 / OIDC', desc: '对接企业 SSO；按 <span class="mono">groups</span> 声明映射到角色。', on: false, tag: '' },
          { icon: 'user', name: '环境变量用户（兼容）', desc: '继续支持 <span class="mono">LOGIN</span> / <span class="mono">LOGIN_PASSWORD_*</span> / <span class="mono">PERMISSIONS</span>，可一键"导入为成员"后改用界面管理。', on: true, tag: '向后兼容' },
          { icon: 'lock', name: 'API Token / MCP', desc: '给脚本与 AI 工具发放独立 token，绑定到某个成员，权限与人工登录一致。', on: false, tag: '' },
        ];
        return `
          <div class="row between" style="margin-bottom:12px">
            <div><h1>认证方式</h1><div class="sub">成员从哪里来。权限永远挂在本地的"成员"对象上，换登录方式不影响授权。</div></div>

          <div class="grid k2">
            ${methods.map(m => `<div class="card" style="margin:0">
              <div class="row between"><h2>${svg(m.icon)} ${m.name} ${m.tag ? `<span class="pill ${m.tag === '向后兼容' ? 'a' : 'b'}">${m.tag}</span>` : ''}</h2>

          <div class="banner" style="margin-top:14px">${svg('info')}<div>关键取舍：<strong>认证与授权解耦</strong>。不管是本地密码、LDAP 还是 OAuth，进来之后都映射到同一个"成员 + 角色"模型，所以权限配置只有一套。</div></div>`;
      }

            <h2>权限模型（四层，自上而下收窄）</h2>
            <table class="tbl"><tbody>
              <tr><td style="width:130px"><strong>1 连接</strong></td><td>能不能连上这台服务器 / 看到这个连接。对应已有 <span class="mono">connections/&lt;conid&gt;</span> 与 <span class="mono">role_connections</span>。</td></tr>
              <tr><td><strong>2 数据库</strong></td><td>这台服务器里能看到哪些库、能做什么。<span class="mono">无权限 / 可见 / 只读 / 读写 / 执行脚本</span>。对应已有 <span class="mono">getDatabasePermissionRole()</span> 与 <span class="mono">role_databases</span>。</td></tr>
              <tr><td><strong>3 对象</strong></td><td>库内某张表/视图/存储过程的例外。档位 <span class="mono">read / update_only / create_update_delete / run_script / deny</span>，范围 <span class="mono">tables/views/procedures/...</span>。对应 <span class="mono">role_tables</span>。</td></tr>
              <tr><td><strong>4 细粒度</strong></td><td>行级过滤（WHERE 注入）、列级脱敏、最大行数/超时/时段/IP、操作开关（DDL、导出、备份、杀进程）。</td></tr>
            </tbody></table>
            <h2 style="margin-top:14px">三个必须守住的原则</h2>
            <div class="hint" style="line-height:1.9">
              ① <strong>默认拒绝</strong>：连接授权只是前提，库和对象没有命中规则就是无权限（与现有后端 <span class="mono">getDatabasePermissionRole</span> 的默认值一致）。<br />
              ② <strong>拒绝优先</strong>：任一角色显式 deny，则该库对该用户不可见，不允许另一个角色"提权"回来。<br />
              ③ <strong>权限只从角色来</strong>：成员不直接挂权限，避免"悄悄单独放权"，也让审计只对一份配置。
            </div>
            <h2 style="margin-top:14px">这个原型覆盖的页面</h2>
            <div class="hint" style="line-height:1.9">
              概览 / 用户 / 角色与授权（基础·连接·数据库·对象·细粒度·成员）/ 访问矩阵（按角色可编辑、按成员只读）/ 权限预览模拟 / 审计日志 / 认证方式；外加右上角切换登录身份后，左侧"数据库"树按权限实时过滤。
            </div>
            <div class="banner">${svg('info')}<div>数据全是演示数据；「保存」只在浏览器内存里生效，不会写任何后端。</div></div>`,
        });
      }

      // ============================================================ 事件
      document.addEventListener('click', e => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const act = t.getAttribute('data-act');
        const [cmd, ...rest] = act.split(':');
        const arg = rest.join(':');
        switch (cmd) {
          case 'theme': state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; renderShell(); break;
          case 'help': helpModal(); break;
          case 'user-menu': userMenu(); break;
          case 'usermenu-mask': if (t === e.target) closeModal(); break;
          case 'switch-user': closeModal(); state.currentUserId = arg; if (!canAdmin(curUser()) && state.section !== 'database') state.section = 'database'; renderShell(); toast(`当前登录：<strong>${esc(curUser().name)}</strong>`); break;
          case 'rail:database': state.section = 'database'; renderShell(); break;
          case 'rail:admin':
            if (!canAdmin(curUser())) return toast('该账号没有 <span class="mono">admin/*</span> 权限');
            if (state.section === 'database') state.section = 'overview';
            renderShell(); break;
          case 'rail:files': case 'rail:history': case 'rail:plugins': toast('原型未覆盖该模块'); break;
          case 'section': state.section = arg; renderShell(); break;
          case 'role-tab': state.roleTab = arg; renderShell(); break;
          case 'edit-role': state.editingRoleId = arg; state.roleTab = 'basic'; renderShell(); break;
          case 'new-role':
            openModal({ title: '新建角色', testid: 'AdminNewRoleModal', body: `
              <div class="field"><span class="lb">角色名</span><div class="ctl"><input type="text" name="name" placeholder="如 报表只读" /></div></div>
              <div class="field"><span class="lb">说明</span><div class="ctl"><input type="text" name="desc" placeholder="这个角色是干什么的" /></div></div>
              <div class="field"><span class="lb">复制自</span><div class="ctl"><select name="from"><option value="">空白角色（默认全部拒绝）</option>${roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div>`,
              onOk: () => {
                const name = mval('name').trim(); if (!name) return toast('请填写角色名');
                const from = roleById(mval('from'));
                const id = 'role-' + Date.now();
                roles.push({ id, name, builtin: false, desc: mval('desc') || '', permissions: from ? [...from.permissions] : ['widgets/database'], connections: from ? { all: from.connections.all, ids: [...from.connections.ids] } : { all: false, ids: [] }, databases: from ? from.databases.map(r => ({ ...r, id: 'r' + Math.random().toString(36).slice(2, 8) })) : [], objects: [], rowFilters: [], colMasks: [], ops: from ? { ...from.ops } : { ddl: false, export: false, backup: false, kill: false, multi: false, pluginInstall: false }, limits: from ? { ...from.limits } : { maxRows: 0, timeout: 0, hours: '', ips: '' }, envs: from ? [...from.envs] : [] });
                state.editingRoleId = id; closeModal(); renderShell(); toast(`已创建角色 <strong>${esc(name)}</strong>`);
              } });
            break;
          case 'clone-role': {
            const src = roleById(arg); const id = 'role-' + Date.now();
            roles.push({ ...JSON.parse(JSON.stringify(src)), id, name: src.name + ' 副本', builtin: false });
            state.editingRoleId = id; renderShell(); toast('已复制角色'); break;
          }
          case 'del-role': {
            const r = roleById(arg);
            if (memberCount(r.id)) return toast('该角色还有成员，请先调整成员角色');
            roles.splice(roles.indexOf(r), 1); state.editingRoleId = roles[0].id; renderShell(); toast('已删除角色'); break;
          }
          case 'toggle-all-conn': { const r = editingRole(); r.connections.all = !r.connections.all; r.connections.ids = []; renderShell(); break; }
          case 'toggle-op': { const r = editingRole(); r.ops[arg] = !r.ops[arg]; renderShell(); break; }
          case 'add-db-rule': dbRuleModal(); break;
          case 'del-db-rule': { const r = editingRole(); r.databases = r.databases.filter(x => x.id !== arg); renderShell(); break; }
          case 'add-obj-rule': objRuleModal(); break;
          case 'del-obj-rule': { const r = editingRole(); r.objects = r.objects.filter(x => x.id !== arg); renderShell(); break; }
          case 'add-rowfilter': rowFilterModal(); break;
          case 'del-rowfilter': { const r = editingRole(); r.rowFilters = r.rowFilters.filter(x => x.id !== arg); renderShell(); break; }
          case 'add-colmask': colMaskModal(); break;
          case 'del-colmask': { const r = editingRole(); r.colMasks = r.colMasks.filter(x => x.id !== arg); renderShell(); break; }
          case 'new-user': userModal(null); break;
          case 'edit-user': userModal(arg); break;
          case 'del-user': { const u = userById(arg); if (u.login === 'admin') return toast('内置管理员不可删除'); users.splice(users.indexOf(u), 1); renderShell(); toast('已删除成员'); break; }
          case 'recycle-user': toast('已加入回收计划（原型演示）'); break;
          case 'preview-user': state.previewUserId = arg; state.section = 'preview'; renderShell(); break;
          case 'open-as-user': state.previewUserId = arg; state.section = 'database'; renderShell(); break;
          case 'matrix-mode': state.matrixMode = arg; renderShell(); break;
          case 'matrix-reset': toast('已重置为各角色显式规则'); break;
          case 'audit-filter': state.auditFilter = arg; renderShell(); break;
          case 'audit-retention': toast('保留策略：默认 90 天（原型演示）'); break;
          case 'import-env': openModal({ title: '从环境变量导入成员', testid: 'AdminImportEnvModal', okText: '导入选中项', body: `
              <div class="hint">检测到进程环境里已配置的登录（<span class="mono">LOGIN</span> / <span class="mono">LOGIN_PASSWORD_*</span>）。导入后它们会变成普通成员，可在界面上继续配权限；未导入的仍然按环境变量生效，行为不变。</div>
              <div style="margin-top:10px">
                ${['svc-etl（LOGIN_PASSWORD_svc-etl）', 'ops（LOGIN_PASSWORD_ops）'].map(x => `<label class="row" style="padding:4px 0"><input type="checkbox" checked /> <span class="mono">${esc(x)}</span></label>`).join('')}
              </div>`,
              onOk: () => { closeModal(); toast('已导入 2 个成员（原型演示）'); } });
            break;
          case 'modal-ok': if (window.__modalOk) window.__modalOk(); break;
          case 'close-modal': closeModal(); break;
          case 'noop': break;
          default: break;
        }
      });
      document.addEventListener('change', e => {
        const t = e.target;
        // 弹窗内：切换"按库名列表 / 按正则 / 全部库"时显示对应输入框
        if (t.name === 'mode' && t.closest('.modal')) {
          const names = $('#f-names');
          const regex = $('#f-regex');
          if (names) names.style.display = t.value === 'list' ? 'grid' : 'none';
          if (regex) regex.style.display = t.value === 'regex' ? 'grid' : 'none';
        }
        if (t.dataset.cell) {
          const [roleId, conid, db] = t.dataset.cell.split('|');
          const r = roleById(roleId);
          r.databases = r.databases.filter(x => !(x.conid === conid && x.mode === 'list' && String(x.names).split(/[,\n]/).map(s => s.trim()).includes(db)));
          if (t.value) r.databases.push({ id: 'r' + Date.now() + Math.random().toString(36).slice(2, 6), conid, mode: 'list', names: db, regex: '', level: t.value });
          renderShell(); toast(`${esc(r.name)} · <span class="mono">${esc(db)}</span> → ${esc(t.value ? level(t.value).label : '无规则')}`);
        }
        if (t.dataset.input === 'preview-user') { state.previewUserId = t.value; renderShell(); }
        if (t.dataset.input === 'matrix-env') { state.matrixEnv = t.value; renderShell(); }
        if (t.dataset.conn) {
          const r = editingRole();
          const set = new Set(r.connections.ids);
          t.checked ? set.add(t.dataset.conn) : set.delete(t.dataset.conn);
          r.connections.ids = [...set];
          renderShell();
        }
        if (t.dataset.limit) { editingRole().limits[t.dataset.limit] = Number(t.value) || 0; renderShell(); }
        if (t.dataset.field === 'role-name') { editingRole().name = t.value; renderShell(); }
        if (t.dataset.field === 'role-desc') { editingRole().desc = t.value; }
        if (t.dataset.field === 'role-perms') { editingRole().permissions = t.value.split('\n').map(s => s.trim()).filter(Boolean); }
        if (t.dataset.input && t.dataset.input.startsWith('matrix-search')) { state.matrixSearch = t.value; renderShell(); }
      });
      document.addEventListener('input', e => {
        const t = e.target;
        if (t.dataset.input === 'user-search') {
          state.userSearch = t.value; renderShell();
          const el = $('[data-input="user-search"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
        if (t.dataset.input === 'matrix-search') {
          state.matrixSearch = t.value; renderShell();
          const el = $('[data-input="matrix-search"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

      function userMenu() {
        const html = `<div class="modal-mask" data-act="usermenu-mask"><div class="modal" style="width:340px;position:absolute;top:52px;right:14px;left:auto;bottom:auto">
          <div class="modal-head"><span class="t">切换登录身份（演示）</span><div class="grow"></div><button class="btn ghost sm" data-act="close-modal">${svg('close', 'sm')}</button></div>
          <div class="modal-body" style="padding:8px">
            ${users.map(u => `<div class="side-item ${u.id === state.currentUserId ? 'active' : ''}" data-act="switch-user:${u.id}">
              ${svg('user', 'sm')}<div><div>${esc(u.name)} <span class="sub mono">${esc(u.login)}</span></div><div class="sub">${u.roles.map(r => esc(roleById(r)?.name)).join(' + ')}${canAdmin(u) ? ' · 可管理' : ' · 不可管理'}</div></div></div>`).join('')}
          </div>
          <div class="modal-foot" style="justify-content:flex-start"><span class="hint">切换后左侧数据库树与"管理"入口会按该身份变化。</span></div>
        </div></div>`;
        $('#modal-root').innerHTML = html;
      }

      renderShell();
    </script>
  </body>
</html>
